<title>Dev's Joke Galaxy</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Comic Sans MS","Trebuchet MS",sans-serif;background:#f4e07a;color:#5c3317;overflow-x:hidden}
#stars{position:fixed;inset:0;z-index:-1}
.star{position:absolute;border-radius:50%;animation:tw 2s infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:.9}}
header{text-align:center;padding:24px}
h1{font-size:clamp(2rem,6vw,3.5rem);margin:.2em;color:#c47a00;text-shadow:3px 3px #c45a12}
.top{font-size:1.3rem;color:#1a4a8a;font-weight:bold}
button{font-family:inherit;font-size:1.4rem;border:0;border-radius:40px;padding:16px 32px;min-height:52px;cursor:pointer;margin:6px;font-weight:bold;box-shadow:0 5px 0 rgba(92,51,23,.35);transition:transform .1s}
button:active{transform:translateY(3px)}
.all{background:#1aa6a0;color:#5c3317}
.stop{background:#d62828;color:#f3e6a8}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px;padding:20px;max-width:1200px;margin:auto}
.card{border-radius:28px;padding:20px;color:#5c3317;text-align:center;transition:transform .3s,box-shadow .3s;border:5px solid transparent}
.card.active{transform:scale(1.04);border-color:#e6b800;box-shadow:0 0 40px #e6b800}
.card svg{width:100%;max-width:240px;height:180px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(2deg)}}
.setup{font-size:1.5rem;font-weight:bold;min-height:3.2em}
.punch{font-size:1.5rem;color:#d62828;font-weight:bold;min-height:2em;opacity:0;transform:scale(.3)}
.punch.show{animation:pop .6s forwards}
@keyframes pop{70%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:1}}
.play{background:#2e6de6;color:#f3e6a8;font-size:1.6rem}
.reveal{background:#e6b800;color:#5c3317}
.conf{position:fixed;width:12px;height:12px;top:-20px;z-index:9;animation:fall 2s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.spin{animation:spin 8s linear infinite;transform-origin:center;transform-box:fill-box}
@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body><div id="stars"></div>

const st=document.getElementById('stars');
const pal=['#ff8c1a','#e6b800','#2e9a3c','#c0c0c0','#2e6de6','#d62828','#1aa6a0','#8b5a2b'];
for(let i=0;i<120;i++){const d=document.createElement('div');d.className='star';const z=Math.random()*4+2;Object.assign(d.style,{width:z+'px',height:z+'px',left:Math.random()*100+'%',top:Math.random()*100+'%',background:pal[i%8],animationDelay:Math.random()*2+'s'});st.appendChild(d)}
const g=document.getElementById('grid');
J.forEach((j,i)=>{const c=document.createElement('div');c.className='card';c.id='j'+i;c.style.background=j.c;
c.innerHTML=`<svg viewBox="0 0 240 180" role="img" aria-label="illustration">${j.svg}</svg><div class="setup">${j.s}</div><div class="punch">${j.p}</div><button class="play">🔊 Play</button><button class="reveal">Tap for answer!</button>`;
c.querySelector('.play').onclick=()=>{stopAll();playOne(i)};c.querySelector('.reveal').onclick=()=>reveal(i);g.appendChild(c)});
const synth=window.speechSynthesis;let token=0;
function voice(){const v=synth?synth.getVoices():[];return v.find(x=>/en[-_]IN/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))}
function say(t,tk){return new Promise(r=>{if(!synth||tk!==token)return r();const u=new SpeechSynthesisUtterance(t);const v=voice();if(v)u.voice=v;u.rate=.95;u.pitch=1.15;u.onend=u.onerror=()=>r();synth.speak(u)})}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function reveal(i){const p=document.querySelector('#j'+i+' .punch');p.classList.remove('show');void p.offsetWidth;p.classList.add('show');confetti()}
function confetti(){const cs=['#ff8c1a','#e6b800','#2e9a3c','#c0c0c0','#2e6de6','#d62828','#1aa6a0','#8b5a2b'];for(let k=0;k<40;k++){const e=document.createElement('div');e.className='conf';e.style.left=Math.random()*100+'vw';e.style.background=cs[k%8];e.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}}
async function playOne(i,tk=token){const c=document.getElementById('j'+i);document.querySelectorAll('.card').forEach(x=>x.classList.remove('active'));c.classList.add('active');c.scrollIntoView({behavior:'smooth',block:'center'});
c.querySelector('.punch').classList.remove('show');await say(J[i].s,tk);if(tk!==token)return;await wait(1200);if(tk!==token)return;reveal(i);await say(J[i].p,tk);await wait(1500)}
function stopAll(){token++;if(synth)synth.cancel();document.querySelectorAll('.card').forEach(x=>x.classList.remove('active'))}
document.getElementById('playAll').onclick=async()=>{stopAll();const tk=token;for(let i=0;i<J.length&&tk===token;i++)await playOne(i,tk)};
document.getElementById('stop').onclick=stopAll;
if(synth&&synth.onvoiceschanged!==undefined)synth.onvoiceschanged=()=>{};
</script></body></html>
