<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" id="einstein-sprite">
  <defs>
    <pattern id="halftone" patternUnits="userSpaceOnUse" width="6" height="6">
      <circle cx="1.5" cy="1.5" r="1" fill="#1a1a2e" opacity="0.15"/>
    </pattern>
    <filter id="ink">
      <feMorphology operator="dilate" radius="0.3"/>
    </filter>
  </defs>
  <!-- Body / sweater -->
  <ellipse cx="100" cy="200" rx="55" ry="35" fill="#E85D04" stroke="#1a1a2e" stroke-width="3"/>
  <rect x="55" y="155" width="90" height="50" rx="8" fill="#F48C06" stroke="#1a1a2e" stroke-width="3"/>
  <!-- Lab coat lapels -->
  <path d="M70 155 L85 175 L70 195" fill="none" stroke="#1a1a2e" stroke-width="2.5"/>
  <path d="M130 155 L115 175 L130 195" fill="none" stroke="#1a1a2e" stroke-width="2.5"/>
  <!-- Neck -->
  <rect x="88" y="140" width="24" height="20" fill="#F5D0A9" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Head -->
  <ellipse cx="100" cy="95" rx="48" ry="52" fill="#F5D0A9" stroke="#1a1a2e" stroke-width="3.5"/>
  <ellipse cx="100" cy="95" rx="48" ry="52" fill="url(#halftone)"/>
  <!-- Wild hair -->
  <g id="hair" fill="#F4F1DE" stroke="#1a1a2e" stroke-width="2.5" stroke-linejoin="round">
    <path d="M55 90 Q40 50 55 35 Q70 20 85 40"/>
    <path d="M70 45 Q75 15 95 25 Q110 10 120 30"/>
    <path d="M110 35 Q130 5 145 30 Q160 20 155 55"/>
    <path d="M145 70 Q165 55 158 85 Q170 95 150 105"/>
    <path d="M52 100 Q35 85 42 115 Q30 125 55 120"/>
    <ellipse cx="100" cy="48" rx="42" ry="28" fill="#F4F1DE"/>
  </g>
  <!-- Eyes idle -->
  <g id="eyes-idle">
    <ellipse cx="82" cy="90" rx="10" ry="12" fill="#fff" stroke="#1a1a2e" stroke-width="2.5"/>
    <ellipse cx="118" cy="90" rx="10" ry="12" fill="#fff" stroke="#1a1a2e" stroke-width="2.5"/>
    <circle cx="84" cy="92" r="5" fill="#1a1a2e"/>
    <circle cx="120" cy="92" r="5" fill="#1a1a2e"/>
    <circle cx="86" cy="90" r="1.5" fill="#fff"/>
    <circle cx="122" cy="90" r="1.5" fill="#fff"/>
  </g>
  <!-- Eyebrows -->
  <path d="M70 75 Q82 70 92 76" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
  <path d="M108 76 Q118 70 130 75" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
  <!-- Mustache -->
  <g id="mustache" fill="#F4F1DE" stroke="#1a1a2e" stroke-width="2">
    <path d="M85 115 Q100 125 115 115 Q108 130 100 128 Q92 130 85 115"/>
  </g>
  <!-- Mouth idle smile -->
  <path id="mouth-idle" d="M90 132 Q100 140 110 132" fill="none" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M100 95 L95 112 Q100 116 105 112 Z" fill="#E8B88A" stroke="#1a1a2e" stroke-width="2"/>
</svg>
